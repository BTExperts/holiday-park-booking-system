name: Sync Release Branch to Public Repo

on:
  push:
    branches:
      - release

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push release branch to public repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_PAT }}@github.com/BTExperts/holiday-park-booking-system.git
          git push public release --force
